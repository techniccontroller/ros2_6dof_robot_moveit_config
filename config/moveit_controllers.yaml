# MoveIt uses this configuration for controller management

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

# The Pico firmware performs low-level point-to-point control and can need a
# few seconds to settle after the time-parameterized trajectory ends.
trajectory_execution.allowed_execution_duration_scaling: 1.2
trajectory_execution.allowed_goal_duration_margin: 6.0
trajectory_execution.allowed_start_tolerance: 0.05

moveit_simple_controller_manager:
  controller_names:
    - scaled_joint_trajectory_controller
    - robotiq_2f_urcap_adapter

  scaled_joint_trajectory_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
  robotiq_2f_urcap_adapter:
    type: GripperCommand
    action_ns: gripper_command
    default: true
    joints:
      - gripper_joint
    max_effort: 20.0
